<body>

    <main>
        <h1>Форма-анкета</h1>
        
        <!-- Форма отправляется методом POST -->
        <form action="#" method="POST" class="survey-form">
            <div class="form-group">
                <label for="lastname">Фамилия:</label>
                <input type="text" id="lastname" name="lastname" required>
            </div>

            <div class="form-group">
                <label for="firstname">Имя:</label>
                <input type="text" id="firstname" name="firstname" required>
            </div>

            <div class="form-group">
                <label for="login">Логин:</label>
                <input type="text" id="login" name="login" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="subject">Выбор предмета:</label>
                <select id="subject" name="subject">
                    <option value="web">Веб-программирование</option>
                    <option value="db">Базы данных</option>
                    <option value="oop">Объектно-ориентированное программирование</option>
                    <option value="math">Высшая математика</option>
                </select>
            </div>

            <div class="form-group">
                <label>Выбор времени:</label><br>
                <label><input type="radio" name="time" value="morning" checked> Утро (9:00 - 12:00)</label>
                <label><input type="radio" name="time" value="day"> День (12:00 - 15:00)</label>
                <label><input type="radio" name="time" value="evening"> Вечер (15:00 - 18:00)</label>
                <label><input type="radio" name="time" value="night"> Ночь (18:00 - 21:00)</label>
            </div>

            <div class="form-group">
                <label>Форма контроля:</label><br>
                <label><input type="checkbox" name="control[]" value="test"> Тест</label>
                <label><input type="checkbox" name="control[]" value="interview"> Собеседование</label>
                <label><input type="checkbox" name="control[]" value="report"> Доклад</label>
                <label><input type="checkbox" name="control[]" value="exam"> Контрольная работа</label>
            </div>

            <div class="form-group">
                <label for="info">Дополнительная информация:</label>
                <textarea id="info" name="info" rows="4"></textarea>
            </div>

            <button type="submit" class="submit-btn">Отправить данные</button>
        </form>
    </main>
</body>
</html>
