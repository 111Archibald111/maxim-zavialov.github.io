<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация на конференцию</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стили формы (Flexbox и Grid) */
        .conf-container { max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .conf-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: 1 / -1; }
        .conf-form label { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .conf-form input[type="text"], .conf-form input[type="tel"], .conf-form input[type="email"], .conf-form input[type="date"], .conf-form select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .error-msg { color: red; font-size: 12px; margin-top: 5px; display: none; }
        .radio-group { display: flex; gap: 15px; align-items: center; margin-top: 5px; }
        .submit-btn { grid-column: 1 / -1; background: #4CAF50; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .submit-btn:hover { background: #45a049; }
        #reportTopicGroup { display: none; grid-column: 1 / -1; }
        
        /* Стили таблицы */
        .table-container { margin-top: 40px; }
        .conf-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .conf-table th, .conf-table td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        .conf-table th { background: #333; color: white; }
        .conf-table tr:nth-child(even) { background: #f9f9f9; }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="conference.html">Конференция</a></li>
            <li><a href="task7.html">Шаблон (Задание 7)</a></li>
            <li><a href="gallery.html">Фотогалерея</a></li>
        </ul>
    </nav>

    <main class="conf-container">
        <h1 style="text-align: center; color: #333;">Регистрация участников конференции</h1>
        
        <form id="confForm" class="conf-form" novalidate>
            <div class="form-group">
                <label>ФИО (только русские буквы)</label>
                <input type="text" id="fio" placeholder="Иванов Иван Иванович" required>
                <span class="error-msg" id="err-fio">Введите ФИО (только русские буквы)</span>
            </div>

            <div class="form-group">
                <label>Контактный телефон</label>
                <input type="tel" id="phone" placeholder="+79998887766" required>
                <span class="error-msg" id="err-phone">Формат: +7 и 10 цифр</span>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@mail.ru" required>
                <span class="error-msg" id="err-email">Некорректный email</span>
            </div>

            <div class="form-group">
                <label>Секция конференции</label>
                <select id="section" required>
                    <option value="">-- Выберите секцию --</option>
                    <option value="Математика">Математика</option>
                    <option value="Физика">Физика</option>
                    <option value="Информатика">Информатика</option>
                </select>
                <span class="error-msg" id="err-section">Выберите секцию</span>
            </div>

            <div class="form-group">
                <label>Дата рождения (необязательно)</label>
                <input type="date" id="dob">
            </div>

            <div class="form-group full-width">
                <label>Планируете доклад?</label>
                <div class="radio-group">
                    <label><input type="radio" name="report" value="yes" id="repYes"> Да</label>
                    <label><input type="radio" name="report" value="no" id="repNo" checked> Нет</label>
                </div>
            </div>

            <div class="form-group" id="reportTopicGroup">
                <label>Тема доклада</label>
                <input type="text" id="reportTopic" placeholder="Введите тему">
            </div>

            <button type="submit" class="submit-btn">Отправить заявку</button>
        </form>

        <div class="table-container">
            <h2 style="color: #333;">Список зарегистрированных участников</h2>
            <table class="conf-table">
                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Телефон</th>
                        <th>Email</th>
                        <th>Секция</th>
                        <th>Доклад</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Сюда скрипт будет добавлять строки -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const form = document.getElementById('confForm');
        const repYes = document.getElementById('repYes');
        const repNo = document.getElementById('repNo');
        const reportTopicGroup = document.getElementById('reportTopicGroup');
        const usersTableBody = document.getElementById('usersTableBody');

        // 1. Показ поля для темы доклада (Задание 1.1)
        repYes.addEventListener('change', () => { reportTopicGroup.style.display = 'flex'; });
        repNo.addEventListener('change', () => { reportTopicGroup.style.display = 'none'; });

        // 2. Загрузка данных при старте страницы из "БД" (localStorage)
        let users = JSON.parse(localStorage.getItem('confUsers')) || [];
        renderTable();

        // 3. Валидация и отправка (Задание 1.2)
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            let isValid = true;

            // Очистка ошибок
            document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');

            const fio = document.getElementById('fio').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const section = document.getElementById('section').value;
            const dob = document.getElementById('dob').value;
            const hasReport = repYes.checked;
            const topic = document.getElementById('reportTopic').value.trim();

            // Валидация ФИО (только русские буквы и пробелы)
            if (!/^[А-Яа-яЁё\s]+$/.test(fio)) {
                document.getElementById('err-fio').style.display = 'block'; isValid = false;
            }
            // Валидация телефона (+7 и 10 цифр)
            if (!/^\+7\d{10}$/.test(phone)) {
                document.getElementById('err-phone').style.display = 'block'; isValid = false;
            }
            // Валидация Email
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById('err-email').style.display = 'block'; isValid = false;
            }
            // Валидация секции
            if (section === "") {
                document.getElementById('err-section').style.display = 'block'; isValid = false;
            }

            if (isValid) {
                // Создаем запись
                const newUser = { fio, phone, email, section, dob, report: hasReport ? `Да: ${topic}` : 'Нет' };
                users.push(newUser);
                
                // Сохраняем в "БД" (localStorage)
                localStorage.setItem('confUsers', JSON.stringify(users));
                
                // Обновляем таблицу и очищаем форму
                renderTable();
                form.reset();
                reportTopicGroup.style.display = 'none';
                alert('Регистрация успешна!');
            }
        });

        // 4. Отрисовка таблицы (Задание 1.6)
        function renderTable() {
            usersTableBody.innerHTML = '';
            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.fio}</td>
                    <td>${user.phone}</td>
                    <td>${user.email}</td>
                    <td>${user.section}</td>
                    <td>${user.report}</td>
                `;
                usersTableBody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
